<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} — Daily Music Gems</title>
<meta name="description" content="{{EXCERPT}}">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://dailymusicgems.xyz{{URL}}">
<meta name="theme-color" content="#130f0c">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/assets/style.css">
<script src="/assets/gem.js" defer></script>

<!-- Open Graph -->
<meta property="og:type" content="article">
<meta property="og:url" content="https://dailymusicgems.xyz{{URL}}">
<meta property="og:site_name" content="Daily Music Gems">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{EXCERPT}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{EXCERPT}}">
<meta name="twitter:image" content="{{OG_IMAGE}}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <div class="nav">
    <a href="/#top" class="brand" aria-label="Daily Music Gems home"><span class="brand-mark">DMG</span></a>
    <nav class="navlinks">
      <a href="/#listen"><svg class="navlink-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2" y="14" width="5" height="7" rx="2"/><rect x="17" y="14" width="5" height="7" rx="2"/></svg><span class="navlink-text">Listen</span></a>
      <a href="/#writing"><svg class="navlink-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span class="navlink-text">Writing</span></a>
      <a href="/#about"><svg class="navlink-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg><span class="navlink-text">About</span></a>
    </nav>
  </div>
</header>

<main>
  <article class="wrap post">
    <a href="/#writing" class="btn btn-ghost back-link">← Back to all writing</a>
    <span class="tag">{{CATEGORY}}</span>
    <h1>{{TITLE}}</h1>
    <p class="post-meta">{{DATE}}</p>
    {{IMAGE}}
    {{PLAYER}}
    <div class="post-body">
{{BODY}}
    </div>
    {{DISCLOSURE}}
    <div class="post-footer">
      <a href="/#writing" class="btn btn-ghost">← Back to all writing</a>
    </div>
  </article>
</main>

<footer>
  <div class="wrap footer-inner">
    <span>© 2026 Daily Music Gems</span>
    <div class="social">
      <a href="https://www.tiktok.com/@dailymusicgems" target="_blank" rel="noopener noreferrer">TikTok</a>
      <a href="mailto:partnerships@dailymusicgems.xyz">Say hello</a>
    </div>
  </div>
</footer>

</body>
</html>
