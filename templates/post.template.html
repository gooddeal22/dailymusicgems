<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} — Daily Music Gems</title>
<meta name="description" content="{{EXCERPT}}">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://dailymusicgems.xyz{{URL}}">
<meta name="theme-color" content="#0b0714">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/assets/style.css">

<!-- Open Graph -->
<meta property="og:type" content="article">
<meta property="og:url" content="https://dailymusicgems.xyz{{URL}}">
<meta property="og:site_name" content="Daily Music Gems">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{EXCERPT}}">
<meta property="og:image" content="https://dailymusicgems.xyz/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{EXCERPT}}">
<meta name="twitter:image" content="https://dailymusicgems.xyz/og-image.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <div class="nav">
    <a href="/#top" class="brand"><span class="gem"></span> Daily Music Gems</a>
    <nav class="navlinks">
      <a href="/#listen">Listen</a>
      <a href="/#writing">Writing</a>
      <a href="/#about">About</a>
    </nav>
  </div>
</header>

<main>
  <article class="wrap post">
    <a href="/#writing" class="btn btn-ghost back-link">← Back to all writing</a>
    <span class="tag">{{CATEGORY}}</span>
    <h1>{{TITLE}}</h1>
    <p class="post-meta">{{DATE}}</p>
    <div class="post-body">
{{BODY}}
    </div>
    <div class="post-footer">
      <a href="/#writing" class="btn btn-ghost">← Back to all writing</a>
    </div>
  </article>
</main>

<footer>
  <div class="wrap footer-inner">
    <span>© 2026 Daily Music Gems</span>
    <div class="social">
      <a href="https://www.tiktok.com/@dailymusicgems" target="_blank" rel="noopener noreferrer">TikTok</a>
      <a href="mailto:esauaguirre595@gmail.com">Say hello</a>
    </div>
  </div>
</footer>

</body>
</html>
