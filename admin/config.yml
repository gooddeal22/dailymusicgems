backend:
  name: github
  repo: gooddeal22/dailymusicgems
  branch: main
  base_url: https://dailymusicgems.xyz
  auth_endpoint: api/auth

# This tells the CMS to open a real GitHub login, handled by our own OAuth
# endpoints running as Cloudflare Pages Functions (functions/api/auth.js and
# functions/api/callback.js) — this replaces Netlify's built-in OAuth bridge.
# Only GitHub accounts you've given push access to your repo can log in and publish.

media_folder: "content/uploads"
public_folder: "/uploads"

collections:
  - name: "posts"
    label: "Articles"
    label_singular: "Article"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "Put the artist name in the title and say what the piece is about, e.g. 'Why Frank Ocean's Blonde Still Sounds Like the Future'. Keep it under 60 characters so Google shows all of it." }
      - { label: "Artist", name: "artist", widget: "string", required: false, hint: "The artist this piece is about. Spell it the same way every time. It builds the artist page, the By Artists index and the 'More on this artist' links under each post." }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Gem of the Day"
          - "Style Analysis"
          - "Discography Deep-Dive"
          - "Artist Evolution"
          - "Album Review"
          - "Other"
      - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", picker_utc: true }
      - { label: "Player Link (Gem of the Day)", name: "player_url", widget: "string", required: false, hint: "Paste the share link for the song. Supported: a Spotify track/album/playlist link, a YouTube or YouTube Music video link, or a full soundcloud.com track link (not on.soundcloud.com short links). Official links only - never upload audio files." }
      - { label: "Sponsored? (paid or gifted)", name: "sponsored", widget: "boolean", default: false, required: false, hint: "Leave OFF unless the artist, a label or anyone else gave you money, free product or other benefits for this post. Turning it ON adds a visible 'Sponsored' label and disclosure (required by FTC guidelines)." }
      - { label: "Excerpt", name: "excerpt", widget: "text", required: false, hint: "Google shows this under your title in search results, so write 120-155 characters that say what the reader will learn. Also shown on the homepage card. For a Gem of the Day, write 1-2 sentences on why this song is a gem - it shows on the homepage next to the player. Auto-generated from the body if left blank." }
      - { label: "Featured Image", name: "image", widget: "image", required: false, hint: "Shown at the top of the article, on its preview card and when the link is shared. Use a real image of the artist or cover art you have rights to, at least 1200 wide." }
      - { label: "Featured", name: "featured", widget: "boolean", default: false, required: false, hint: "Check this to include the piece in the homepage 'Featured' picks. You choose which pieces count as featured." }
      - { label: "Body", name: "body", widget: "markdown", required: false, hint: "Optional for a Gem of the Day. Short quotes only - do not paste full lyrics." }
